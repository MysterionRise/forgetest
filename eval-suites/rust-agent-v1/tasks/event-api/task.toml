schema_version = 1
id = "event-api"
name = "Migrate the event message API"
description = "Evolve a public enum while preserving completed-event behavior."
category = "api_migration"
language = "rust"
prompt = "prompt.md"
workspace = "workspace"
grader = "grader"
reference_patch = "reference.patch"
timeout_secs = 240
tags = ["api", "migration"]

[verifier]
timeout_secs = 60

[[verifier.checks]]
name = "new event API contract"
kind = "fail_to_pass"
command = ["cargo", "test", "--test", "hidden", "--locked"]

[[verifier.checks]]
name = "existing library tests"
kind = "pass_to_pass"
command = ["cargo", "test", "--lib", "--locked"]

[provenance]
kind = "authored"
license = "MIT OR Apache-2.0"
audited_at = "2026-07-27"
