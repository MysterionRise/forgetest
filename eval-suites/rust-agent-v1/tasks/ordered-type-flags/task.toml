schema_version = 1
id = "ordered-type-flags"
name = "Respect ordered type flag overrides"
description = "Reduced adaptation of ripgrep's ordered CLI flag migration."
category = "api_migration"
language = "rust"
prompt = "prompt.md"
workspace = "workspace"
grader = "grader"
reference_patch = "reference.patch"
timeout_secs = 240
tags = ["snapshot", "cli", "migration"]

[verifier]
timeout_secs = 60

[[verifier.checks]]
name = "ordered override regression"
kind = "fail_to_pass"
command = ["cargo", "test", "--test", "hidden", "--locked"]

[[verifier.checks]]
name = "existing library tests"
kind = "pass_to_pass"
command = ["cargo", "test", "--lib", "--locked"]

[provenance]
kind = "snapshot"
license = "MIT OR Unlicense"
