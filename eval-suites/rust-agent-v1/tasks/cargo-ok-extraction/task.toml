schema_version = 1
id = "cargo-ok-extraction"
name = "Protect package extraction marker"
description = "Reduced adaptation of Cargo's CVE-2022-36113 fix."
category = "security_robustness"
language = "rust"
prompt = "prompt.md"
workspace = "workspace"
grader = "grader"
reference_patch = "reference.patch"
