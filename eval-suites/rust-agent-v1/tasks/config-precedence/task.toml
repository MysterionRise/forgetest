schema_version = 1
id = "config-precedence"
name = "Fix trusted configuration precedence"
description = "Make explicit command-line values override file and user defaults."
category = "bug_fix"
language = "rust"
prompt = "prompt.md"
workspace = "workspace"
grader = "grader"
reference_patch = "reference.patch"
timeout_secs = 120
tags = ["configuration", "precedence"]

[verifier]
timeout_secs = 60

[[verifier.checks]]
name = "precedence regression"
kind = "fail_to_pass"
command = ["cargo", "test", "--test", "hidden", "--locked"]

[[verifier.checks]]
name = "existing library tests"
kind = "pass_to_pass"
command = ["cargo", "test", "--lib", "--locked"]

[provenance]
kind = "authored"
license = "MIT OR Apache-2.0"
audited_at = "2026-07-27"
