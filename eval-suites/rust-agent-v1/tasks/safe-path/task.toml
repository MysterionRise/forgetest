schema_version = 1
id = "safe-path"
name = "Reject lexical path escapes"
description = "Harden a root-relative path resolver."
category = "security_robustness"
language = "rust"
prompt = "prompt.md"
workspace = "workspace"
grader = "grader"
reference_patch = "reference.patch"
timeout_secs = 240
tags = ["security", "path-traversal"]

[verifier]
timeout_secs = 60

[[verifier.checks]]
name = "path traversal regression"
kind = "fail_to_pass"
command = ["cargo", "test", "--test", "hidden", "--locked"]

[[verifier.checks]]
name = "existing library tests"
kind = "pass_to_pass"
command = ["cargo", "test", "--lib", "--locked"]

[provenance]
kind = "authored"
license = "MIT OR Apache-2.0"
audited_at = "2026-07-27"
