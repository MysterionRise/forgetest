# Example GitHub Actions workflow for running forgetest in CI.
#
# Copy this to .github/workflows/llm-eval.yml in your repository.
# Set the ANTHROPIC_API_KEY secret and ANTHROPIC_MODEL_ID variable in your
# repository settings.

name: LLM Eval

on:
  # Run weekly
  schedule:
    - cron: '0 6 * * 1'
  # Allow manual triggers
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  security-events: write

jobs:
  eval:
    name: Run LLM Evaluations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install forgetest
        run: cargo install --path crates/forgetest-cli

      - name: Validate eval sets
        run: forgetest validate --eval-set eval-sets/

      - name: Run evaluations
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
        run: |
          forgetest run \
            --eval-set eval-sets/rust-basics.toml \
            --models "anthropic/${ANTHROPIC_MODEL_ID}" \
            --format all \
            --output results/

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: eval-results-${{ github.run_number }}
          path: results/

      # Optional: Download previous baseline and check for regressions
      - name: Download baseline
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: eval-baseline
          path: baseline/
        continue-on-error: true

      - name: Check for regressions
        if: hashFiles('baseline/report.json') != ''
        run: |
          forgetest compare \
            --baseline baseline/report.json \
            --current results/report-*.json \
            --fail-on-regression \
            --format markdown

      # Optional: Upload SARIF for GitHub Code Scanning
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results/
        continue-on-error: true
